services:
  - type: web
    name: dc-bot-store
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start -w apps/server
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 3001
      - key: DATA_DIR
        value: /opt/render/project/src/data
